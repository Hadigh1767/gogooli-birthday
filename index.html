<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برای گوگولی | ۲۱ مهر</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --autumn-bg: #1a0f0a; /* قهوه‌ای بسیار تیره */
            --autumn-gold: #c5a059; /* طلایی پاییزی */
            --autumn-orange: #d35400; /* نارنجی سوخته */
            --autumn-cream: #f4e1d2; /* کرم گرم */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--autumn-bg);
            color: var(--autumn-cream);
            font-family: 'Vazirmatn', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* جلوگیری از اسکرول برگ‌ها */
            position: relative;
        }

        /* انیمیشن برگریزان */
        .leaves-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .leaf {
            position: absolute;
            font-size: 20px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .card {
            background: rgba(45, 30, 25, 0.85);
            border: 1px solid var(--autumn-gold);
            padding: 40px;
            max-width: 400px;
            text-align: center;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 20px rgba(197, 160, 89, 0.2);
            backdrop-filter: blur(10px);
            z-index: 1;
        }
        h1 { font-family: 'Playfair Display', serif; color: var(--autumn-gold); margin-bottom: 10px; font-size: 2.5rem; }
        p { line-height: 1.8; margin-bottom: 20px; }
        
        #play {
            background: transparent;
            color: var(--autumn-gold);
            border: 1px solid var(--autumn-gold);
            padding: 10px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Vazirmatn';
            transition: all 0.3s;
        }
        #play:hover { background: var(--autumn-gold); color: #000; }
    </style>
</head>
<body>

    <!-- لایه‌ی برگ‌ها -->
    <div class="leaves-container" id="leaves"></div>

    <div class="card">
        <small style="color: var(--autumn-orange);">۲۱ مهر • برای یک حالِ خوب</small>
        <h1>گوگولی</h1>
        <p>تولدت مبارک، راضیه جان</p>
        <p style="font-size: 0.95rem;">بعضی هدیه‌ها قرار نیست فقط دیده شوند؛<br>قرار است <strong>شنیده شوند و بمانند.</strong></p>
        
        <button id="play">پخش آهنگ 🎵</button>
        <audio id="audio" src="music.mp3"></audio>
    </div>

    <script>
        // تولید برگ‌ها
        const leavesContainer = document.getElementById('leaves');
        const leafTypes = ['🍁', '🍂', '🍃'];
        for(let i=0; i<15; i++) {
            const span = document.createElement('span');
            span.innerHTML = leafTypes[Math.floor(Math.random() * leafTypes.length)];
            span.className = 'leaf';
            span.style.left = Math.random() * 100 + 'vw';
            span.style.animationDuration = (Math.random() * 5 + 5) + 's';
            span.style.animationDelay = Math.random() * 5 + 's';
            leavesContainer.appendChild(span);
        }

        // منطق پخش موسیقی (بدون تغییر)
        const playBtn = document.getElementById('play');
        const audio = document.getElementById('audio');
        playBtn.addEventListener('click', () => {
            if(audio.paused) {
                audio.play();
                playBtn.innerText = '❚❚ توقف';
            } else {
                audio.pause();
                playBtn.innerText = 'پخش آهنگ 🎵';
            }
        });
    </script>
</body>
</html>
